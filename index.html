<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Additive Unicode-Chiffre (Vigenère-Prinzip)</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  padding:16px;
  max-width:600px;
  margin:auto;
}
textarea,input,button{
  font-size:1rem;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
}
.key-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.key-row input{ flex:1; }
.key-row button{
  width:48px;
  font-size:18px;
}
button.action{
  width:100%;
  margin-top:10px;
  background:#007bff;
  color:white;
  font-weight:bold;
  border:none;
}
.output{
  background:#f5f5f5;
  padding:12px;
  margin-top:16px;
  border-radius:8px;
  white-space:pre-wrap;
  word-break:break-word;
}
.note{
  margin-top:8px;
  font-size:0.9em;
  opacity:0.7;
}
</style>
</head>

<body>

<h1>Additive Unicode-Chiffre (Vigenère-Prinzip)</h1>

<textarea id="text" placeholder="Text eingeben (Klartext oder empfangener Code)"></textarea>

<div class="key-row">
  <input id="key" type="password" placeholder="Schlüsselwort">
  <button type="button" id="toggleKey" onclick="toggleKey()">👁️</button>
</div>

<button class="action" onclick="encrypt()">Verschlüsseln</button>
<button class="action" onclick="decrypt()">Entschlüsseln</button>

<div id="output" class="output"></div>

<button class="action" onclick="copyOutput()">Ergebnis kopieren & zurücksetzen</button>

<div class="note">
ℹ️ Die App erkennt automatisch, ob der Text Base64 (Messenger/E-Mail) oder normaler Text ist.
</div>

<script>
/* -------------------------------------------------
   Unicode-Normalisierung & Hilfsfunktionen
------------------------------------------------- */

function clean(str){
  return str
    .normalize("NFC")
    .replace(/\r\n/g,"\n");
}

function toCodePoints(str){
  return Array.from(str, ch => ch.codePointAt(0));
}

function fromCodePoints(arr){
  return arr.map(cp => String.fromCodePoint(cp)).join("");
}

/* -------------------------------------------------
   Vigenère-artige Unicode-Chiffre
------------------------------------------------- */

function vigenereEncrypt(text, key){
  const t = toCodePoints(text);
  const k = toCodePoints(key);
  return fromCodePoints(
    t.map((cp,i)=>(cp + k[i % k.length]) % 0x110000)
  );
}

function vigenereDecrypt(text, key){
  const t = toCodePoints(text);
  const k = toCodePoints(key);
  return fromCodePoints(
    t.map((cp,i)=>(cp - k[i % k.length] + 0x110000) % 0x110000)
  );
}

/* -------------------------------------------------
   Base64 Transport (Messenger-sicher)
------------------------------------------------- */

function encodeForTransport(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function decodeFromTransport(str){
  const bin = atob(str);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/* -------------------------------------------------
   Automatische Transport-Erkennung
------------------------------------------------- */

function looksLikeBase64(str){
  const s = str.trim();
  if(s.length < 8 || s.length % 4 !== 0) return false;
  if(!/^[A-Za-z0-9+/=]+$/.test(s)) return false;

  try{
    atob(s);
    return true;
  }catch(e){
    return false;
  }
}

/* -------------------------------------------------
   Aktionen
------------------------------------------------- */

function encrypt(){
  if(!key.value){
    alert("Bitte Schlüssel eingeben");
    return;
  }

  const plain = clean(text.value);
  const k = clean(key.value);

  const cipherUnicode = vigenereEncrypt(plain, k);
  const transportSafe = encodeForTransport(cipherUnicode);

  output.textContent = transportSafe;
}

function decrypt(){
  if(!key.value){
    alert("Bitte denselben Schlüssel erneut eingeben");
    return;
  }

  const source =
    output.textContent.trim() !== ""
      ? output.textContent
      : text.value;

  let cipherUnicode;

  if(looksLikeBase64(source)){
    try{
      cipherUnicode = decodeFromTransport(source.trim());
    }catch(e){
      alert("Base64-Dekodierung fehlgeschlagen (Text beschädigt)");
      return;
    }
  }else{
    cipherUnicode = clean(source);
  }

  const k = clean(key.value);
  output.textContent = vigenereDecrypt(cipherUnicode, k);
}

/* -------------------------------------------------
   Kopieren & Reset
------------------------------------------------- */

function copyOutput(){
  const value = output.textContent;
  if(!value) return;

  navigator.clipboard.writeText(value).then(()=>{
    text.value="";
    key.value="";
    output.textContent="";
    text.focus();
  });
}

/* -------------------------------------------------
   Schlüssel ein/ausblenden
------------------------------------------------- */

function toggleKey(){
  const input = document.getElementById("key");
  const btn = document.getElementById("toggleKey");
  if(input.type==="password"){
    input.type="text";
    btn.textContent="🙈";
  }else{
    input.type="password";
    btn.textContent="👁️";
  }
}

/* -------------------------------------------------
   PWA
------------------------------------------------- */

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
